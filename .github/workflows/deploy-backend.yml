name: Deploy Backend to VM

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          # Verbose debug to see which step fails
          set -x

          echo "--- secret presence check ---"
          [ -z "$SSH_PRIVATE_KEY" ] && { echo "SSH_PRIVATE_KEY is EMPTY"; exit 1; } || echo "SSH_PRIVATE_KEY: ${#SSH_PRIVATE_KEY} chars"
          [ -z "$VM_HOST" ] && { echo "VM_HOST is EMPTY"; exit 1; } || echo "VM_HOST: $VM_HOST"
          [ -z "$VM_USER" ] && { echo "VM_USER is EMPTY"; exit 1; } || echo "VM_USER: $VM_USER"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "--- key file check ---"
          wc -l ~/.ssh/id_ed25519
          head -1 ~/.ssh/id_ed25519
          tail -1 ~/.ssh/id_ed25519

          echo "--- key format validation ---"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "Key is VALID" || echo "Key is INVALID"

          echo "--- host key scan ---"
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          echo "==> Pull latest"
          cd ~/KOBI-Asistani
          git fetch origin main
          git reset --hard origin/main

          echo "==> Activate venv"
          source .venv/bin/activate

          echo "==> Install dependencies (only if changed)"
          pip install -e . --quiet

          echo "==> Apply migrations"
          alembic upgrade head

          echo "==> Restart backend"
          sudo -n systemctl restart kobi-backend

          echo "==> Wait for backend to come up"
          sleep 4

          echo "==> Health check"
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend healthy after $i attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check FAILED"
          sudo -n systemctl status kobi-backend --no-pager | tail -20
          exit 1
          REMOTE_SCRIPT

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy failed. Check log above and SSH to VM for details."
