services:
  postgres:
    image: postgres:16-alpine
    container_name: kobi-postgres
    environment:
      POSTGRES_USER: kobi
      POSTGRES_PASSWORD: kobi
      POSTGRES_DB: kobi_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobi -d kobi_db"]
      interval: 5s
      timeout: 5s
      retries: 5
